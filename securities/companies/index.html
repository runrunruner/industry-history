<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>証券会社一覧｜業界変遷図アーカイブ</title>
  <meta name="description" content="証券業界の変遷図に登場する会社名を五十音別に一覧表示し、各社の沿革と出典を確認できます。">
  <link rel="canonical" href="https://runrunruner.github.io/industry-history/securities/companies/">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#1c4f7c">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:site_name" content="業界変遷図アーカイブ">
  <meta property="og:title" content="証券会社一覧｜業界変遷図アーカイブ">
  <meta property="og:description" content="証券業界の変遷図に登場する会社名を五十音別に一覧表示し、各社の沿革と出典を確認できます。">
  <meta property="og:url" content="https://runrunruner.github.io/industry-history/securities/companies/">
  <meta property="og:image" content="https://runrunruner.github.io/industry-history/common/og-share.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://runrunruner.github.io/industry-history/common/og-share.png">
  <link rel="icon" href="../../common/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="title-block">
      <div class="breadcrumbs">
        <a href="../../">TOP</a><span>›</span><a href="../">証券業界 変遷図</a><span>›</span><strong>会社一覧</strong>
      </div>
      <h1>証券会社一覧</h1>
      <p>会社名を選択すると、その会社名が登場する沿革イベントと出典を確認できます。</p>
    </div>
    <a class="diagram-link" href="../">変遷図を見る</a>
  </header>

  <main class="page-shell">
    <div class="company-layout">
      <section class="index-card" aria-labelledby="kana-heading">
        <div class="index-sticky">
          <div class="section-heading">
            <div>
              <p class="eyebrow">COMPANY INDEX</p>
              <h2 id="kana-heading">証券会社一覧</h2>
            </div>
            <p id="company-count" class="company-count">読み込み中…</p>
          </div>

          <div class="company-search" role="search">
            <label class="sr-only" for="company-search">会社名を検索</label>
            <div class="company-search-row">
              <input id="company-search" type="search" autocomplete="off" placeholder="会社名を検索　例：野村證券">
              <button id="company-search-clear" type="button" class="search-clear" hidden>解除</button>
            </div>
            <p id="search-result-status" class="search-result-status" aria-live="polite"></p>
          </div>

          <div class="company-status-filter" aria-label="会社の状態で絞り込み">
            <span class="status-filter-label">表示</span>
            <div class="status-filter-buttons" role="group" aria-label="会社の状態">
              <button type="button" class="status-filter-button is-active" data-status-filter="all" aria-pressed="true">すべて</button>
              <button type="button" class="status-filter-button" data-status-filter="current" aria-pressed="false">現存</button>
              <button type="button" class="status-filter-button" data-status-filter="historical" aria-pressed="false">歴史上</button>
            </div>
          </div>

          <nav id="kana-nav" class="kana-nav" aria-label="五十音索引"></nav>
          <div id="reading-notes" class="reading-notes" hidden></div>
        </div>
        <div id="company-groups" class="company-groups" aria-live="polite">
          <p class="loading">会社一覧を読み込んでいます…</p>
        </div>
      </section>

      <aside id="company-detail" class="detail-card" aria-live="polite">
        <div class="detail-empty">
          <p class="eyebrow">COMPANY HISTORY</p>
          <h2>会社の沿革</h2>
          <p>左の一覧から会社名を選択してください。</p>
        </div>
      </aside>
    </div>
  </main>

  <button id="back-to-top" class="back-to-top" type="button" aria-label="ページ上部へ戻る">↑ <span>ページ上部へ</span></button>

  <footer class="site-footer">
    <span>業界変遷図アーカイブ</span>
    <a href="../">証券業界 変遷図へ</a>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>

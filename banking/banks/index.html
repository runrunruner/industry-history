<body>
  <header class="site-header">
    <div class="title-block">
      <div class="breadcrumbs">
        <a href="../../">TOP</a><span>›</span><a href="../">銀行業界 変遷図</a><span>›</span><strong>銀行一覧</strong>
      </div>
      <h1>銀行一覧</h1>
      <p>変遷図に登場する銀行・旧行名を五十音順で掲載しています。銀行名を選択すると、その名称が登場する沿革イベントと出典を確認できます。</p>
    </div>
    <a class="diagram-link" href="../">変遷図を見る</a>
  </header>

  <main class="page-shell">
    <div class="company-layout">
      <section class="index-card" aria-labelledby="kana-heading">
        <div class="index-sticky">
          <div class="section-heading">
            <div>
              <p class="eyebrow">BANK INDEX</p>
              <h2 id="kana-heading">銀行一覧</h2>
            </div>
            <p id="company-count" class="company-count">読み込み中…</p>
          </div>

          <div class="company-search" role="search">
            <label class="sr-only" for="company-search">銀行名を検索</label>
            <div class="company-search-row">
              <input id="company-search" type="search" autocomplete="off" placeholder="銀行名を検索　例：りそな銀行">
              <button id="company-search-clear" type="button" class="search-clear" hidden>解除</button>
            </div>
            <p id="search-result-status" class="search-result-status" aria-live="polite"></p>
          </div>

          <div class="company-status-filter" aria-label="銀行の状態で絞り込み">
            <span class="status-filter-label">表示</span>
            <div class="status-filter-buttons" role="group" aria-label="銀行の状態">
              <button type="button" class="status-filter-button is-active" data-status-filter="all" aria-pressed="true">すべて</button>
              <button type="button" class="status-filter-button" data-status-filter="current" aria-pressed="false">現存</button>
              <button type="button" class="status-filter-button" data-status-filter="historical" aria-pressed="false">歴史上</button>
              <button type="button" class="status-filter-button" data-status-filter="terminal-unknown" aria-pressed="false">終端不明</button>
            </div>
          </div>

          <nav id="kana-nav" class="kana-nav" aria-label="五十音索引"></nav>
          <div id="reading-notes" class="reading-notes" hidden></div>
        </div>
        <div id="company-groups" class="company-groups" aria-live="polite">
          <p class="loading">銀行一覧を読み込んでいます…</p>
        </div>
      </section>

      <aside id="company-detail" class="detail-card" aria-live="polite">
        <div class="detail-empty">
          <p class="eyebrow">BANK HISTORY</p>
          <h2>銀行の沿革</h2>
          <p>左の一覧から銀行名を選択してください。</p>
        </div>
      </aside>
    </div>
  </main>

  <button id="back-to-top" class="back-to-top" type="button" aria-label="ページ上部へ戻る">↑ <span>ページ上部へ</span></button>
